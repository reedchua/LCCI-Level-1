<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCCI Level 1 會計模擬試題練習系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.05em;
            margin-bottom: 12px;
            white-space: pre-line;
        }
        .options {
            margin-left: 10px;
        }
        .option-label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 5px;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button.btn-reset {
            background-color: #e67e22;
        }
        button.btn-reset:hover {
            background-color: #d35400;
        }
        .result-box {
            display: none;
            background: #e8f8f5;
            border: 1px solid #2ecc71;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 25px;
            text-align: center;
        }
        .correct {
            color: #27ae60;
            font-weight: bold;
        }
        .wrong {
            color: #c0392b;
            font-weight: bold;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        /* 版權宣告樣式 */
        .copyright-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #4a5568;
            font-size: 0.95em;
            line-height: 1.8;
        }
        .copyright-footer strong {
            color: #2d3748;
            font-size: 1.05em;
        }
        .copyright-footer a {
            color: #0073e6;
            text-decoration: none;
        }
        .copyright-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LCCI Level 1 會計線上練習題庫</h1>
    <p class="subtitle">系統每次將隨機抽選 30 題進行練習</p>

    <div id="resultBox" class="result-box">
        <h2>練習結果</h2>
        <p id="scoreText" style="font-size: 1.2em;"></p>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>

        <div class="btn-container">
            <button type="button" onclick="submitQuiz()">提交答案並核對</button>
            <button type="button" class="btn-reset" onclick="initQuiz()">重新隨機抽取 30 題</button>
        </div>
    </form>

    <!-- 版權宣告區塊 -->

        <p>如有課程查詢、教學合作或意見反饋，歡迎聯絡：<a href="mailto:reedchua@yahoo.com">reedchua@yahoo.com</a></p>
    </footer>
</div>

<script>
const questionBank = [
    // --- Level 1 (Mock 1) ---
    { id: "M1_01", type: "mc", question: "If a credit entry is made in ledger account, which of the following may taken places?", options: ["Increase capital", "Increase in liability", "Increase in asset", "Decrease in asset"], answer: "Increase in liability" },
    { id: "M1_02", type: "mc", question: "Identify which of the following statement is true.", options: ["A sales invoice is to provide details of goods returned to a supplier", "A statement of account is to notify a customer of an overdue account", "A credit note is to request a payment from a supplier", "A debit note is to provide a summary of goods sold to customer"], answer: "A statement of account is to notify a customer of an overdue account" },
    { id: "M1_03", type: "mc", question: "Which one of the following books of original entry would use to record goods returned to a supplier?", options: ["Cash Book", "Purchase Day Book", "Purchase Return Day Book", "Sales Return Day Book"], answer: "Purchase Return Day Book" },
    { id: "M1_04", type: "mc", question: "Which one of the following transactions would be classed as revenue expenditure?", options: ["Purchase of motor vehicle", "Carriage of motor vehicle to buyer", "Interest paid on a bank loan", "Signwriting on motor vehicle"], answer: "Interest paid on a bank loan" },
    { id: "M1_05", type: "text", question: "Wallace runs a small stationery shop. At the end of the first year of trade, the business owns a computer worth $15,000 and has inventory to the value of $6,000. The balance on the bank account at the same date is a negative balance of $2,000 and outstanding payment to suppliers is $6,500. What is the value of capital Walter has invested in the business at the year-end date?\nEnter your answer as a whole number only and do not use any symbols (e.g. $), comma (,) or full stop (.)", answer: "12500" },
    { id: "M1_06", type: "mc", question: "A business has identified that cash sales amount $5,500 made on the last day of the financial year has been omitted from the book. Which of the following is the right journal entry to correct the error?", options: ["Dr. Sales $11,000, Cr. Cash $11,000", "Dr. Sales $5,500 Cr. Cash $5,500", "Dr. Cash $11,000, Cr. Sales $11,000", "Dr. Cash $5,500, Cr. Sales $5,500"], answer: "Dr. Cash $5,500, Cr. Sales $5,500" },
    { id: "M1_07", type: "text", question: "Lena has ordered 500 units of product CT01 which has a list price of $2.00 per unit. The following discounts are available:\n20% trade discount\n3% cash discount for early payment of the invoice within 7 days\n\nAssuming Lena meets the requirments of all discount available, how much will Lena pay to settle this transaction?\nEnter your answer as a whole number only and do not use any symbols (e.g. $), comma (,) or full stop (.)", answer: "776" },
    { id: "M1_08", type: "mc", question: "Classify which of the following is liability.", options: ["Money owed from a customer who bought goods from us", "Money owed to a suppler who suppied goods to us", "A positive balance of bank account", "A bank loan to acquire non-current assets"], answer: "Money owed to a suppler who suppied goods to us" },
    { id: "M1_09", type: "mc", question: "Identify the error of the following transaction.\nBank charges $50 paid from the business bank account was recorded as a debit to bank charges and a credit to the bank account.", options: ["Original entry", "Compensation", "Reversal of entries", "No error"], answer: "No error" },
    { id: "M1_10", type: "mc", question: "Eva made a sale to a credit customer amount to $2,000 on 1 Jan 2025. On 31 Jan 2025, the customer makes a payment by bank transfer to the business account of Eva for $2,000 in full settlement of the invoice.\nWhich of the following double entry is correct for this transaction?", options: ["Dr. Bank, Cr. Trade Receivable", "Dr. Cash, Cr. Bank", "Dr. Trade Receivable, Cr. Bank", "Dr. Bank, Cr. Cash"], answer: "Dr. Bank, Cr. Trade Receivable" },
    { id: "M1_11", type: "mc", question: "Identify which of the following account would appear on the debit side of a trial balance?", options: ["Rental income accrued", "Rental income prepaid", "Accumulated depreciation", "A negaive balance of bank account"], answer: "Rental income accrued" },
    { id: "M1_12", type: "mc", question: "Gladys operates a business as a sole trader. She has withdrawn some money from bank account to use to purchase some new equipment for her business use. She has made the following entries in the general ledger:\nDr. Purchases\nCredit: Bank\n\nIf the error is not fixed, what will be the impace on the balance on purchase and equipment account?", options: ["Purchase account overstated, Equipment account overstated", "Purchase account overstated, Equipment account understated", "Purchase account understated, Equipment account overstated", "Purchase account understated, Equipment account understated"], answer: "Purchase account overstated, Equipment account understated" },
    { id: "M1_13", type: "mc", question: "Refer to Q12, which of the following accounting concept was voliated by accounting staff?", options: ["Accrual", "Business entity", "Consistency", "Prudence"], answer: "Business entity" },
    { id: "M1_14", type: "text", question: "CT Electronic uses petty cash imprest system to pay samll amount of office expenses. The imprest amount is $250 per month.\nIn April 2025, the following amounts were paid out of petty cash.\nTravelling: $75\nOffice expenses: $38\nStamps: $26\n\nCT Electronic should withdraw $[ INSERT VALUE ] to restore the petty cash balance.", answer: "139" },
    { id: "M1_15", type: "mc", question: "Identify which of the following statement is true.", options: ["Capital expenditure is the expenditure that enhances the value of asset", "Revenue expenditure is the expenditure that enhances the value of asset", "Capital expenditure is the expenditure that involved in operation, not long-term asset", "Revenue expenditure is the expenditure that involved in operation, not long-term asset"], answer: "Capital expenditure is the expenditure that enhances the value of asset" },
    { id: "M1_16", type: "mc", question: "Wilson runs a small stationery shop. He acquired a motor vehilce listed at $200,000; and paid $40,000 by personal cheque on 1 April 2025, with the balance to be settled six months later.\nWhich of the following effects of the above-mentioned transaction is correct?", options: ["Asset increase, capital increase, liabiliy increase", "Asset increase, capital increase, liability decrease", "Asset increase, capital decrease, liability decrease", "Assest decrease, capital increase, liability decrease"], answer: "Asset increase, capital increase, liabiliy increase" },
    { id: "M1_17", type: "mc", question: "Whcih of the following account must be debit balance in trial balance?", options: ["Assets", "Capital", "Liability", "Income"], answer: "Assets" },
    { id: "M1_18", type: "mc", question: "Identify the dual effects for purchase of inventory for resales on credit.", options: ["Asset increase, liabilities increase", "Asset increase, liabilities decrease", "Asset decrease, liabilities increase", "Asset decrease, liabilities decrease"], answer: "Asset increase, liabilities increase" },
    { id: "M1_19", type: "mc", question: "Identify which of the following statement is true.", options: ["Standing order is fixed monthly payment is transferred from the bank to a specific supplier", "Direct Debit is a variable monthly payment is transferred from the bank to a specific supplier.", "Outstanding lodgements are deposits not yet shown on the bank statement.", "Debit balance in cash book is equivalent to credit balance in bank statement"], answer: "Debit balance in cash book is equivalent to credit balance in bank statement" },
    { id: "M1_20", type: "mc", question: "Identify which of the following statement is true?", options: ["Gross pay is an operation expenses which will appear in profit or loss account", "National Health Insurance and chartiable donation are voluntary deduction", "Time rate refer to wage is based on the number of unit produced", "Statutory deduction is a deduction that is required by legislation"], answer: "Statutory deduction is a deduction that is required by legislation" },
    { id: "M1_21", type: "mc", question: "Which of the following will appear at a debit side of receivable ledger control account?", options: ["The opening balance", "Credit sales", "Contra offset", "Cheque return"], answer: "The opening balance" },
    { id: "M1_22", type: "text", question: "Lena purchased a motor van for business use. The motor van cost of $30,000 and is to be depreciated using the straight line method basis at a rate of 20%.\nThe depreciation charge for the third year of ownership of motor van is:", answer: "6000" },
    { id: "M1_23", type: "mc", question: "Which of the following transaction will lower the profit for the year of a business firm?", options: ["Repaid loan by cheque", "Paid telephone expenses", "Goods return from credit customer", "Bought motor vehicle for business use"], answer: "Paid telephone expenses" },
    { id: "M1_24", type: "mc", question: "Which of the following is correct if the closing inventory of a business firm decrease and rental expenses increases.", options: ["Gross profit increase, profit for the year increase", "Gross profit increase, profit for the year decrease", "Gross profit decrease, profit for the year decrease", "Gross profit decrease, profit for the year increase"], answer: "Gross profit decrease, profit for the year decrease" },
    { id: "M1_25", type: "mc", question: "The [increase / decrease] of depreciation charge will appear in statement of profit or loss account as operating expense, and will be [increase / decrease] the profit for the year (net profit) in the statement of profit or loss.", options: ["Increase, increase", "Decrease, decrease", "Increase, decrease", "Decrease, increase"], answer: "Increase, decrease" },
    { id: "M1_26a", type: "mc", question: "Which of the following will appear under the section of current assets in statement of financial position?", options: ["Trade receivables", "Trade payables", "Income accrued", "Rent accrued"], answer: "Trade receivables" },
    { id: "M1_26b", type: "mc", question: "Which of the following will appear under the section of current liabilities in statement of financial position?", options: ["Rental income prepaid", "Rental Income accrued", "Inventory", "All of above"], answer: "Rental income prepaid" },
    { id: "M1_27", type: "mc", question: "The irrecoverable debt serves as [ ] which will apper in the [ ] side of trial balance.", options: ["Expense, debit", "Expense, credit", "Income, debit", "Income, credit"], answer: "Expense, debit" },
    { id: "M1_28", type: "mc", question: "If a customer overpays and is due a refund, where would the balance on their account appear?", options: ["Debit side in discount allowed account as an expense", "Credit side in discount received account as an income", "Credit side in cash book as a cash transfer", "Credit side in receivable control account as a minority balance"], answer: "Credit side in receivable control account as a minority balance" },
    { id: "M1_29", type: "text", question: "Tina works on a production line and is paid using a time rate plus bonus method. A bonus is paid where production is completed faster than the expected duration. The bonus is paid a double of the time rate for each hour of production time saved.\nTina’s time rate is $16.00 per hour and she has worked 35 hours in the week 28. The expected output per hour is 30 units. In the current week Tina has produced 1170 units.\nTina’s gross pay for week 28 is:", answer: "688" },
    { id: "M1_30", type: "mc", question: "Cheque payments made to suppliers have been recorded in the cash book but are not yet shown on the bank statement. This is:", options: ["Late logement / Uncredited cheque", "Unpresented cheque", "Standing order", "Direct debit"], answer: "Unpresented cheque" },

    // --- Level 1 (Mock 2) ---
    { id: "M2_01", type: "mc", question: "A business owner deposits $8,000 into the business bank account. Which one of the following identifies the dual effect of the above transaction", options: ["Increase an liability and decrease capital", "Increase an asset and decrease a liability", "Increase an asset and decrease capital", "Increase an asset and increase capital"], answer: "Increase an asset and increase capital" },
    { id: "M2_02", type: "mc", question: "Which one of the following transactions should be completed by using a journal entry", options: ["Purchasing a non-current asset on credit", "Recording purchase return in the general ledger", "Recording a bank payment to a credit supplier", "Recording a bank receipt from credit customer"], answer: "Purchasing a non-current asset on credit" },
    { id: "M2_03", type: "text", question: "Walter purchased a computer for business use on 1 April 2025. The total cost of the computer included purchase price $18000, installation costs $1200, fuel $400. What is the value of equipment which should be capitalized", answer: "19200" },
    { id: "M2_04", type: "mc", question: "A customer makes an instruction to their bank to pay a fixed amount at regular intervals to a named party, for example, rent expenses. Which one of the following payment methods would be the most suitable for the business owner in this situation", options: ["Direct Debit", "Standing Order", "Cheque", "Debit Card"], answer: "Standing Order" },
    { id: "M2_05", type: "mc", question: "Which one of the following correctly identifies the accounting equation?", options: ["Assets + Expenses = Capital + Liabilities + Income", "Assets + Income = Capital + Liabilities + Expenses", "Assets - Income = Capital + Liabilities - Expenses", "Assets + Income = Capital + Liabilities - Expenses"], answer: "Assets + Expenses = Capital + Liabilities + Income" },
    { id: "M2_06", type: "mc", question: "Which of the following should be capitalized in the business", options: ["Motor vehicle at cost", "Signwriting of new vehicle", "Maintenance contract for 3 years", "Fuels"], answer: "Motor vehicle at cost" },
    { id: "M2_07", type: "mc", question: "Identify the error made by a bookkeeper for recording owner's drawings as wages of business.", options: ["Original entry", "Commission", "Principle", "Omission"], answer: "Principle" },
    { id: "M2_08", type: "mc", question: "Classify the transaction of the receipt of a bank loan as:", options: ["Capital Expenditure", "Revenue Expenditure", "Capital Income", "Revenue Income"], answer: "Capital Income" },
    { id: "M2_09", type: "text", question: "Walter uses a petty cash imprest system in business. At the start of the month there is a balance of $250 in petty cash. During the month, $65 postage, $62 cleaning and $40 refreshment were paid out of petty cash. How much should Walter withdraw from bank to restore the petty cash balance?", answer: "167" },
    { id: "M2_10", type: "mc", question: "A document sent by the seller to the customer showing the transactions for a period of time, usually a month. Which one of the following documents would be the most suitable for this situation?", options: ["Debit note", "Payment advice", "Invoice", "Statement of account"], answer: "Statement of account" },
    { id: "M2_11", type: "mc", question: "Transaction should be reflected in the financial statements for the period in which they occur. Which one of the following accounting principles would be the most suitable for this situation", options: ["Going Concern", "Materiality", "Prudence", "Accruals"], answer: "Accruals" },
    { id: "M2_12", type: "mc", question: "Eva's bank account had an overdrawn balance on 1 April of $210. On 2 April, Eva deposited $700 in the business bank account and paid $250 for workers' wages. What was the balance on Eva's bank account at the close of business on 2 April?", options: ["$210", "$240", "$660", "$770"], answer: "$240" },
    { id: "M2_13", type: "mc", question: "Identify the dual effect of a customer pays an invoice by bank transfer into the business bank account.", options: ["Increase an assets, decrease a liability", "Increase an assets, increase an assets", "Increase an assets, decrease an assets", "Decrease an assets, decrease a liability"], answer: "Increase an assets, decrease an assets" },
    { id: "M2_14", type: "text", question: "Walter purchased 200 items at $12.5 per unit. The customer is entitled to a trade discount of 5%. What is the total value of the invoice?", answer: "2375" },
    { id: "M2_15", type: "mc", question: "Which of the following is not a statutory deduction", options: ["Income tax", "Statutory Pension contribution", "Saving scheme", "All of above"], answer: "Saving scheme" },
    { id: "M2_16", type: "mc", question: "Gross pay is based on hours worked and hours worked in excess of basic hour", options: ["Time rate", "Time rate plus bonus", "Piece rate", "Minimum pay"], answer: "Time rate" },
    { id: "M2_17", type: "text", question: "The contribution of National Health Insurance is:", answer: "Statutory deduction" },
    { id: "M2_18", type: "text", question: "Which of the followings is the correct book of original entry for purchases of inventory for resales by cheque.", answer: "Cash Book" },
    { id: "M2_19", type: "text", question: "Capital at 1 January 2025 is $45,678, Drawings for the year $7,890, Loss for the years, 12,345, Extra capital contribution of owner $3,459. The balance brought down of capital account is:", answer: "28902" },
    { id: "M2_20", type: "mc", question: "Which of the following should be recorded on the debit side of trade payable account?", options: ["Cash receipt of credit sales", "Cash paid to supplier", "Cash purchase", "Discount allowed"], answer: "Cash paid to supplier" },
    { id: "M2_21", type: "text", question: "Eva pays a bonus $10 for every hour that is saved by the production team. The bonus is totalled and then shared equally amongst the members of the team. Each unit is expected to take 12 minutes to complete. 1060 units were completed in the week by a production team of 10 people in 180 hours. What is the amount of production bonus payable to each employee in the week? Enter your answer in whole $ only and do not use any commas (,) or full stops(.)", answer: "32" },
    { id: "M2_22", type: "mc", question: "Which of the following payment method is made by bank under BACS?", options: ["Standing Order", "Cross cheque", "Cash cheque", "Dishonor cheque"], answer: "Standing Order" },
    { id: "M2_23", type: "mc", question: "Which one of the following is a statutory payroll deduction?", options: ["Voluntary pension contribution", "Charitable donation", "Saving scheme", "Tax"], answer: "Tax" },
    { id: "M2_24", type: "mc", question: "Which one of the following identifies where the total of the return inwards daybook should be posted.", options: ["Cr. Receivable Ledger Control Account", "Dr. Receivable Ledger Control Account", "Cr. Payable Ledger Control Account", "Dr. Payable Ledger Control Account"], answer: "Cr. Receivable Ledger Control Account" },
    { id: "M2_25", type: "mc", question: "Which one of the following would be recorded on the credit side of payable ledger control account?", options: ["Cash purchase", "Credit purchase", "Discount allowed", "Discount received"], answer: "Credit purchase" },
    { id: "M2_26", type: "mc", question: "The receivable ledger control account enables a business to see how much is owed by individual customer.", options: ["True", "False"], answer: "False" },
    { id: "M2_27", type: "mc", question: "Which of the following items should be appeared on the credit side of receivable ledger control account?", options: ["Purchases returns", "Discount received", "Contra offset", "Cheque return"], answer: "Contra offset" },
    { id: "M2_28", type: "mc", question: "Which one of the following shows the correct calculation of the profit for the year?", options: ["Revenue - operating expenses", "Revenue - cost of sales", "Gross profit + income - expenses", "Gross profit - income + expenses"], answer: "Gross profit + income - expenses" },
    { id: "M2_29", type: "mc", question: "Which of the following should be recorded as a current assets?", options: ["Rent accrued", "Telephone owing", "Rental income accrued", "Rental income prepaid"], answer: "Rental income accrued" },
    { id: "M2_30", type: "mc", question: "In which section of Statement of Financial Position would petty cash be recorded?", options: ["Non-current assets", "Current assets", "Capital", "Current liabilities"], answer: "Current assets" },
    { id: "M2_31", type: "mc", question: "Which of the following will appear as a debit side of Trial Balance?", options: ["Rental income accrued", "Discount received", "Accumulated depreciation", "Capital"], answer: "Rental income accrued" },
    { id: "M2_32", type: "text", question: "Identify the term being described for the amount of asset is expected to be sold for when it is no longer of use to the business.", answer: "Residual value" },
    { id: "M2_33", type: "mc", question: "Identify which business document would be used to advise a supplier which invoice a customer has settled with their payment.", options: ["Debit Note", "Credit Note", "Remittance Advice", "Statement of Account"], answer: "Remittance Advice" },
    { id: "M2_34", type: "mc", question: "Which one of the following transaction should be completed by using a journal entry", options: ["Recording sales return in the general ledger", "Recording purchase return in the general ledger", "Writing off an irrecoverable debts", "Writing off depreciation of non-current assets"], answer: "Writing off an irrecoverable debts" },
    { id: "M2_35", type: "text", question: "Bank interest paid amount to $75 has been recorded as $67. Which of the accounting principles could be applied in this case (FILL IN THE BLANK)", answer: "Materiality" },
    { id: "M2_36", type: "mc", question: "Which of the followings will appear in debit side of trial balance?", options: ["Profit for the year", "Discount received", "Carriage outwards", "Rental income accured"], answer: "Carriage outwards" },
    { id: "M2_37", type: "mc", question: "An entry to record bank payment of $300 for light and heat was made correctly in the bank account but was posted to telephone expenses instead of light and heat. Which of the followings is the correct double entry in this situation?", options: ["Dr. Telephone expenses, Cr. Light and heat", "Dr. Light and heat, Cr. Bank", "Dr. Telephone expenses, Cr. Bank", "Dr. Light and heat, Cr. Telephone expenses"], answer: "Dr. Light and heat, Cr. Telephone expenses" },
    { id: "M2_38", type: "mc", question: "Which of the followings will appear in Statement of Financial Position?", options: ["Depreciation", "Irrecoverable debts", "Accumulated depreciation", "Gross profit"], answer: "Accumulated depreciation" },
    { id: "M2_39", type: "mc", question: "Which of the following book of original entry is to record the purchase of goods to resales on credit?", options: ["Journal", "Cash Book", "Purchase Day Book", "Sales Day Book"], answer: "Purchase Day Book" },
    { id: "M2_40", type: "mc", question: "Which of the followings is recorded under current liabilities in Statement of Financial Position?", options: ["Rental income prepaid", "Rental income accrued", "4% loan 2028", "Telephone expenses prepaid"], answer: "Rental income prepaid" },

    // --- Level 1 (Mock 3) ---
    { id: "M3_01", type: "mc", question: "Which of the following accounts carry a debit balance in a trial balance?", options: ["Accumulated depreciation", "Bank overdrawn", "Return outwards", "Carriage outwards"], answer: "Carriage outwards" },
    { id: "M3_02", type: "text", question: "On 1 April, Walter purchased goods for $300,000 on credit from suppliers with a trade discount 3%. Another 2% cash discount would be received if settlement was made with 10 days. If Walter makes the settlement on 20 April, the net amount he has to repay is:", answer: "291000" },
    { id: "M3_03", type: "text", question: "Identify the book of original entry used to record purchase of non-current assets on credit.", answer: "Journal" },
    { id: "M3_04", type: "mc", question: "Identify which item would appear on the credit side of trade receivable ledger control account?", options: ["Credit sales", "Cash sales", "Discount allowed", "Discount received"], answer: "Discount allowed" },
    { id: "M3_05", type: "mc", question: "Which of the following transaction will reduce the net profit of a firm?", options: ["Repaid trade payable by cheque", "Pay telephone expenses for office use", "Owner drew $1,000 cash for private use", "Purchase motor vehicle from owner on credit"], answer: "Pay telephone expenses for office use" },
    { id: "M3_06", type: "text", question: "The following is the information related to a firm for the year ended 31 March 2025.\nCapital $50,000 as at 1 April 2024, Gross profit 23,640, extra $5,780 capital invested by owner, drawings $12,300, loss for the year $13,579.\n\nWhat is the balance of capital as at 31 March 2025?", answer: "29901" },
    { id: "M3_07", type: "text", question: "Eva's bank account was overdrawn $7,580 on 1 March. On 2 March, she deposit $15,750 cash to bank and immediately paid $5,500 by bank transfer for rent. The balance on bank account at the close of business on 2 March is:", answer: "2670" },
    { id: "M3_08", type: "text", question: "Using the same method in stock valuation and calculation of depreciation of non-current assets is application for what kind of accounting concept?", answer: "Consistency" },
    { id: "M3_09", type: "text", question: "Walter paid $6,800 for the rent of the office from which he trades during the year ended 31 December 2024. This include $1,800 for the quarter ending January 2025. What amount should appear in the Statement of Profit or Loss as rent for the year ended 31 December 2024. Enter your answer in whole $ only and do not use any full stop (.) or comma (,).", answer: "5600" },
    { id: "M3_10", type: "mc", question: "Debit card is a payment is made to purchase goods online which reduces the funds available in the business bank account immediately.", options: ["True", "False"], answer: "True" },
    { id: "M3_11", type: "mc", question: "Materiality concept means a business will continue in operation for the foreseeable future", options: ["True", "False"], answer: "False" },
    { id: "M3_12", type: "mc", question: "Which of the following would increase the gross profit of a trading firm?", options: ["Increase in sales", "Increase in return inwards", "Decrease in carriage outwards", "Increase in rental received"], answer: "Increase in sales" },
    { id: "M3_13", type: "mc", question: "Which of the following would affect the calculation of cost of sales?", options: ["Return inwards", "Carriage inwards", "Carriage outwards", "Bank interest received"], answer: "Carriage inwards" },
    { id: "M3_14", type: "mc", question: "The underlying accounting principle is:", options: ["Accrual", "Business entity", "Going concern", "Materiality"], answer: "Going concern" },
    { id: "M3_15", type: "mc", question: "What is the main purpose of preparing a trial balance?", options: ["Ensure full set of book is kept properly", "Reflect the profitability and liquidity of the business", "Check the arithmetical accuracy of bookkeeping entries", "All of above"], answer: "Check the arithmetical accuracy of bookkeeping entries" },
    { id: "M3_16", type: "mc", question: "Identify which one of the following is not recorded in cash book.", options: ["Cash purchase", "Credit purchase", "Discount allowed", "Discount received"], answer: "Credit purchase" },
    { id: "M3_17", type: "mc", question: "Identify which one of the following is an assets.", options: ["Rent received prepaid", "Rent received accrued", "Trade payable", "Bank overdrawn"], answer: "Rent received accrued" },
    { id: "M3_18", type: "text", question: "Nicholas started his toy business on 1 Jan 2024. During the year, the following telephone invoice were paid:\nOn 5 May 2024, he paid $2,400 for 4 months to 30 April 2024. On 3 Jul 2024, he paid $1,200 for 2 months to 30 Jun 2024. On 6 Sep 2024, he paid $1,400 for 2 months to 31 August 2024. On 7 Nov 2024, he paid $1,400 for 2 months to 31 October 2024.\n\nThe accrued telephone expenses at 31 Dec 2024 are:", answer: "1400" },
    { id: "M3_19", type: "mc", question: "Identify the effect of omitting bank interest received.", options: ["Gross profit overstated", "Gross profit understated", "Profit for the year overstated", "Profit for the year understated"], answer: "Profit for the year understated" },
    { id: "M3_20", type: "mc", question: "Identify where the rental income prepaid is shown in the Statement of Financial Position:", options: ["Current assets", "Current liabilities", "Non-current assets", "Non-current liabilities"], answer: "Current liabilities" },
    { id: "M3_21", type: "mc", question: "Which of the following will appear in debit side of trial balance?", options: ["Accumulated depreciation", "Rent income accrued", "Profit for the year", "Rent income prepaid"], answer: "Rent income accrued" },
    { id: "M3_22", type: "text", question: "Which of the followings is the right statement for gross pay?", answer: "Basic pay plus overtime pay and bonuses before deductions" },
    { id: "M3_23", type: "text", question: "Which of the following is the right statement of time rates plus bonus?", answer: "Basic hourly wage plus extra payout for time saved" },
    { id: "M3_24", type: "mc", question: "Which of the followings will appear in cash book?", options: ["Discount allowed", "Credit purchase", "Credit sales", "Irrecoverable debts"], answer: "Discount allowed" },
    { id: "M3_25", type: "text", question: "Walter bought 15 chairs for $100 each and received an invoice for the total amount from the supplier. A week later, he returned 2 substandard chairs to suppliers and received a credit note for them. The supplier issues a statement of account at the end of the month showing both transactions is:", answer: "Statement of Account" },
    { id: "M3_26", type: "mc", question: "Eva operates a stationery business as a sole trader. She has withdrawn some goods for her private business. Which of the following entries is correct?", options: ["Dr. Drawings, Cr. Goods", "Dr. Drawings, Cr. Bank", "Dr. Purchase, Cr. Drawings", "Dr. Drawings, Cr. Purchase"], answer: "Dr. Drawings, Cr. Purchase" },
    { id: "M3_27", type: "mc", question: "Which of the followings is revenue expenditure?", options: ["Signwriting of motor vehicle", "Installation cost of new machine", "Decoration of premises", "Disposal of non-current asset"], answer: "Decoration of premises" },
    { id: "M3_28", type: "text", question: "Richard purchased a motor vehicle for business use on 1 April 2024. The purchase price of the motor vehicle was $300,000, he also paid $25,500 installation costs and $5,000 delivery charges. As well as this, the order included $7,500 for 5 maintenance charges for the motor vehicle. The total capital expenditure of motor vehicle is:", answer: "330500" },
    { id: "M3_29", type: "mc", question: "The cost of an asset less any residual value is:", options: ["Depreciation", "Depreciable amount", "Residual value", "Carrying value"], answer: "Depreciable amount" },
    { id: "M3_30", type: "mc", question: "Residual value is the amount of asset that is expected to be sold for when it is no longer of use to the business.", options: ["True", "False"], answer: "True" },
    { id: "M3_31", type: "text", question: "Simon purchased a motor vehicle for business use on 1 April 2020 at a cost of $32,200. The residual value of motor vehicle will be $2,200 and its expected life is 5 years. What is the accumulated depreciation charge shown in Statement of Financial Position as at 31 March 23 on this motor vehicle using the straight-line method of depreciation?", answer: "18000" },
    { id: "M3_32", type: "text", question: "Thomas purchased a computer for business use. The cost of the computer was $42,000. Thomas has decided to depreciate the computer at a rate of 15% using the reducing (diminishing) balance basis. What would be the balance on the accumulated depreciation account at the end of the second year on computer?", answer: "11655" },
    { id: "M3_33", type: "text", question: "Which of the followings should be posted under the section of current liabilities in Statement of Financial Position?", answer: "Trade payables" },
    { id: "M3_34", type: "text", question: "Which of the following book of original entry is to record the sales of goods to customers on credit?", answer: "Sales Day Book" },
    { id: "M3_35", type: "mc", question: "Which of the followings will appear in Statement of Financial Position?", options: ["Carrying value of non-current assets", "Depreciation of non-current assets", "Rental income received", "Gross profit"], answer: "Carrying value of non-current assets" },
    { id: "M3_36", type: "mc", question: "An entry to record bank payment of $300 for light and heat was made correctly in the bank account but was posted to telephone expenses instead of light and heat. Which of the followings is the correct double entry in this situation?", options: ["Dr. Telephone expenses, Cr. Light and heat", "Dr. Light and heat, Cr. Bank", "Dr. Telephone expenses, Cr. Bank", "Dr. Light and heat, Cr. Telephone expenses"], answer: "Dr. Light and heat, Cr. Telephone expenses" },
    { id: "M3_37", type: "mc", question: "Identify which business document would be used to advise a supplier which invoice a customer has settled with their payment.", options: ["Receipt", "Cheque", "Remittance advice", "Invoice"], answer: "Remittance advice" },
    { id: "M3_38", type: "mc", question: "Which of the following items should be appeared on the credit side of receivable ledger control account?", options: ["Purchase return", "Credit sales", "Dishonored cheque", "Bank payment"], answer: "Bank payment" },
    { id: "M3_39", type: "text", question: "Which of the following should be recorded on the debit side of trade payable account?", answer: "Purchases returns" },
    { id: "M3_40", type: "text", question: "Walter uses a petty cash imprest system in business. At the start of the month there is a balance of $350 in petty cash. During the month, $75 postage, $82 cleaning and $46 motor expenses were paid out of petty cash. How much should Walter withdraw from bank to restore the petty cash balance?", answer: "203" },
    { id: "M3_41", type: "text", question: "Lena run a small fashion shop as a sole trader. She has provided the following information for the year ended 31 December 2024.\nCapital as at 1 January 2024 $16,500, Capital introduced during the year $10,000, Drawings during the years $15,000, Profit for the year $35,000. What was the balance of capital as at 31 Dec 2024?", answer: "46500" },
    { id: "M3_42", type: "text", question: "Walter is a sole trader of a property agent. During the year, he received commission as follow:\nOn 26 April, $7,800 for 3 months to 31 March 2024. On 19 July, another $7,800 for 3 months to 30 June 2024. On 20 October, $8,400 for 3 months to 30 September 2024. On 6 December, $5,600 for 2 months to November 2024. What amount should be accrued for commission income at the year end?", answer: "2800" },
    { id: "M3_43", type: "text", question: "Which one of the following shows the correct calculation of gross profit?", answer: "Revenue - Cost of Sales" },
    { id: "M3_44", type: "text", question: "Gladys run a small business as sole trader on 1 January 2025. She deposited $8,000 into the business bank account. Which of the following identifies the dual effect of the above transaction?", answer: "Increase asset, increase capital" },
    { id: "M3_45", type: "mc", question: "Journal is used to recording purchase of grocery by a trading firm to resales.", options: ["True", "False"], answer: "False" },
    { id: "M3_46", type: "mc", question: "Direct debit is to make an online payment for a one-off purchase from a supplier.", options: ["True", "False"], answer: "False" },
    { id: "M3_47", type: "text", question: "Walter’s petty cash book is operated using the imprest system. The imprest amount is $100. At the end of a week, the petty cash remaining was made up as below.\nWhat is the amount of payments that will be recorded in the petty cash book for this period. Enter your answer to 2 decimal places using a full stop", answer: "100.00" },
    { id: "M3_48", type: "mc", question: "The receipt of bank loan is revenue expenditure.", options: ["True", "False"], answer: "False" },
    { id: "M3_49", type: "mc", question: "Credit note is a document issued by a supplier to a customer to reduce the balance owed from a previous invoice.", options: ["True", "False"], answer: "True" },
    { id: "M3_50", type: "mc", question: "A customer makes an instruction to their bank to pay a fixed amount at regular intervals to a name party is direct debit.", options: ["True", "False"], answer: "False" },

    // --- Level 1 (Mock 4) ---
    { id: "M4_01", type: "mc", question: "Which of the book of original entry would be used for record of purchases on credit and goods return from credit customer?", options: ["Purchases Day Book, Return Outwards Day Book", "Purchases Day Book, Return Inwards Day Book", "Sales Day Book, Return Outwards Day Book", "Sales Day Book, Return Inwards Day Book"], answer: "Purchases Day Book, Return Inwards Day Book" },
    { id: "M4_02", type: "text", question: "A sole trader had a balance on its payable ledger of $12,300 at the start of the year and $8,700 at the end of the year. If $68,500 was paid to suppliers during the year, what was the amount of credit purchase for the period?", answer: "64900" },
    { id: "M4_03", type: "text", question: "The opening balance on the receivable ledger control at the beginning of Jun was $25,430. The following transactions appear in the records of the business during June: Credit sales $45,000, Cash received from credit customers $42,000, Returns inwards $1,200. What is the closing balance on the receivable ledger control account at the end of June?", answer: "27230" },
    { id: "M4_04", type: "mc", question: "Which one of the following errors is an error of principle?", options: ["A sales made to M. Walter has been Entered to M. Wallace account in error", "Carriage inwards has been recorded in the carriage outwards account", "Vehicle repairs had been recorded in the Vehicle cleaning account", "A bank loan received has been recorded as capital contribution by owner"], answer: "A bank loan received has been recorded as capital contribution by owner" },
    { id: "M4_05", type: "mc", question: "Identify the balance would appear on debit or credit side of trial balance for (1) commission received and (2) carriage outwards.", options: ["Credit, Debit", "Credit, Credit", "Debit, Debit", "Debit, Credit"], answer: "Credit, Debit" },
    { id: "M4_06", type: "mc", question: "Identify the error of the following situation.\nAn amount paid from the bank for office cleaning was recorded as debit office cleaning and credit bank.", options: ["Error of principle", "Error of commission", "Error of original entry", "None of above"], answer: "None of above" },
    { id: "M4_07", type: "mc", question: "Which of the following ledger accounts would normally carry a debit balance?", options: ["Carriage inwards", "Carriage outwards", "Income accrued", "Expenses prepaid", "Drawings"], answer: "Drawings" },
    { id: "M4_08", type: "mc", question: "Which one of the following accounting concepts is being followed when a provision is made in the financial statement for depreciation on non current assets.", options: ["Accruals", "Business entity", "Consistency", "Materiality"], answer: "Accruals" },
    { id: "M4_09", type: "mc", question: "Debit note is a document which accompanies items being sent back to supplier which have been found to be sub-standard.", options: ["True", "False"], answer: "True" },
    { id: "M4_10", type: "mc", question: "Which of the following records all the business transaction between two businesses within a specific time period.", options: ["Invoice", "Statement of Accounts", "Credit Note", "Debit Note"], answer: "Statement of Accounts" },
    { id: "M4_11", type: "mc", question: "Invoice is a document issued by a supplier to a customer showing goods or services purchased in a single transaction requesting payment.", options: ["True", "False"], answer: "True" },
    { id: "M4_12", type: "mc", question: "What is the dual effect of a bank payment to supplier made by BACS?", options: ["Increase in asset, increase in liability", "Increase in asset, decrease in liability", "Decrease in asset, increase in liability", "Decrease in assets, decrease in liability"], answer: "Decrease in assets, decrease in liability" },
    { id: "M4_13", type: "text", question: "You are preparing sales invoice for a customer, Eva. The purchase order received from Eva shows the following:\n25 pieces x product code WAL123 @$40 each. The customer is entitled to a trade discount of 5%.\n\nWhat amount would show as the amount payable on the invoice?\nEnter your answer in whole $ only and do not use comma and full stop.", answer: "950" },
    { id: "M4_14", type: "text", question: "You have been provided with the following list of balances as at 1 April: Motor Vehicle $15,000, Bank $3,500, Trade Receivables $4,200, Trade Payables $2,800, Inventory $5,000, Bank Loan $8,000. What is the amount of capital invested in the business?\nEnter your answer in whole $ only and do not use comma and full stop.", answer: "16900" },
    { id: "M4_15", type: "mc", question: "Which one of the following statements regarding accounting for payroll is true?", options: ["Tax is a statutory deduction", "Gross pay is the amount the employee earns after the deduction of tax and other deductions", "Piece rate is a method of calculating payroll based on the number of unit produced", "Charitable donation is a voluntary deduction"], answer: "Tax is a statutory deduction" },
    { id: "M4_16", type: "text", question: "Lena receives a monthly salary of $2,000. Each month she pays tax amounting to $150 and contributes $70 per month to a pension scheme. What is the amount of net pay for the month?", answer: "1780" },
    { id: "M4_17", type: "mc", question: "An offset (contra) between receivables and payables will appear on the credit side of payables control account and the debit side of the receivables control account.", options: ["True", "False"], answer: "False" },
    { id: "M4_18", type: "mc", question: "Which one of the following identifies where the total of the discount allowed should be posted?", options: ["Debit side of discount received", "Debit side of payable ledger account", "Credit side of receivable ledger account", "Credit side of discount allowed"], answer: "Credit side of receivable ledger account" },
    { id: "M4_19", type: "mc", question: "When accounting for payroll gross wages appear as a debit entry in the general ledger as a business expenses.", options: ["True", "False"], answer: "True" },
    { id: "M4_20", type: "text", question: "Gladys purchased a sewing machine for use in her business at the start of her financial year. The cost of sewing machine is $10,000. She has a policy of depreciating machinery at a rate of 20% using straight line method of depreciation. What would be the balance on the accumulated depreciation account at the end of the second year in relation to this machinery?", answer: "4000" },
    { id: "M4_21", type: "mc", question: "Which one of the following identifies how to calculate gross profit?", options: ["Revenue - Cost of Sales", "Revenue - Cost of Sales + Other Income - Expenses", "Revenue + Cost of Sales", "Revenue + Cost of Sales - Other Income + Expenses"], answer: "Revenue - Cost of Sales" },
    { id: "M4_22", type: "mc", question: "Classify which of the following is current asset.", options: ["Rental income accrued", "Telephone accrued", "Electricity prepaid", "Goods taken by owner for private use"], answer: "Rental income accrued" },
    { id: "M4_23", type: "mc", question: "Identify which of the following account balances will appear as a debit balance in Trial Balance.", options: ["Depreciation", "Drawings", "Carriage outwards", "Sales return"], answer: "Drawings" },
    { id: "M4_24", type: "mc", question: "Identify which of the following is true.", options: ["Trial balance is to test the arithmetical accuracy of the ledger", "Bank Reconciliation Statement is to compare the additions and deductions on a bank statement with those entered in the general ledger", "Statement of profit or loss account is to summarise the revenue and expenditure in a accounting period", "Preparation of control account is to identify error and perform better credit control"], answer: "Trial balance is to test the arithmetical accuracy of the ledger" },
    { id: "M4_25", type: "text", question: "You have been provided the following extract from the trial balance of a sole trader as at 31 March 2025: Inventory $4,500, Trade Receivables $6,200, Bank $1,800, Rent Prepaid $300, Trade Payables $3,100. What amount would appear as the total of the current assets in the statement of Financial Position at the year end?", answer: "12800" },
    { id: "M4_26", type: "text", question: "Walter purchased a van for use in his business on 1 Jan at a cost of $10,000. The van has a residual value $500 and an expected life of 5 years. What is the carrying value of van in the third year by using the straight line method of depreciation.", answer: "4300" },
    { id: "M4_27", type: "mc", question: "Which of the following is true.", options: ["Irrecoverable debt reduce the profit for the year", "Irrecoverable debts appears on the credit side of a trial balance", "Irrecoverable debt should be deducted from trade payable", "Irrecoverable debt appears on the debit side of profit or loss account"], answer: "Irrecoverable debt reduce the profit for the year" },
    { id: "M4_28", type: "mc", question: "Identify which of the following account balance will appear as a debit entry in an initial trial balance", options: ["Carriage outwards", "Return outwards", "Accumulated depreciation", "Electricity accrued"], answer: "Carriage outwards" },
    { id: "M4_29", type: "text", question: "Stephen enters into an agreement on 1 January to rent a workshop for his business at an agreed rate of $6,000 for the year. His bank account shows payments totalling $5,000 made during the year. What amount should appear in the Statement of Profit or Loss as rent for the year ending 31 December?", answer: "6000" },
    { id: "M4_30", type: "mc", question: "Which of the following would appear on a Statement of Profit or Loss?", options: ["Bank charges", "Bank overdraft", "Bank interest", "Bank loan"], answer: "Bank charges" },

    // --- Level 1 (Mock 5) ---
    { id: "M5_01", type: "mc", question: "Walter introduced a huge amount of cash into the business account to fund his stationery shop. This is to be treated as capital introduced. Which one of the following identifies the dual effect of the above transaction", options: ["Increase a liability and increase capital", "Increase an expenses and increase capital", "Increase an asset and increase an liability", "Increase an asset and increase capital"], answer: "Increase an asset and increase capital" },
    { id: "M5_02", type: "mc", question: "The following general ledger for an income account has been provided for the month of January 2025:\nDebit side: Bank $830\nCredit side: Bal b/d $5,390, Bank $800\nWhat would be the balance carried down on the account as at 31 January 2025", options: ["5390", "6190", "3330", "5360"], answer: "5360" },
    { id: "M5_03", type: "text", question: "Eva's bank account on 1 Jan 2025 showed a positive balance of $340. She has an overdraft facilities on the account with limit $5000.\nOn 4 Jan, she paid telephone expenses $730 and deposited $670 in cash into the account. The closing balance of Eva's bank account on 31 Jan 2025 is:", answer: "280" },
    { id: "M5_04", type: "text", question: "Lena set up her cleaning services company in 1 Jan 2025. All her customers have a credit account with her and the standard payment terms on all the accounts are payment due with 14 days of invoice date.\nLena decided to offer a prompt payment discount to encourage early payment of 2% for payment within 7 days of the invoice.\n\nAn invoice is raised and sent to a customer on 5 May 2025 amounting $3,000. The customer paid her the invoice on 12 May 2025. What amount should the customer pay to clear the invoice?", answer: "2940" },
    { id: "M5_05", type: "mc", question: "If a sole trader wants to make payment for a purchase online immediately but wants the funds to come out of the bank account at a later date, which of the following payment should be used?", options: ["Debit card", "Credit card", "Cheque", "Direct debit"], answer: "Credit card" },
    { id: "M5_06", type: "mc", question: "When making a cheque payment, a business will always require two signatures from approved signatories on the cheque.", options: ["True", "False"], answer: "False" },
    { id: "M5_07", type: "mc", question: "Which of the following should be treated as revenue expenditure?", options: ["Purchase price of non-current asset", "Installation cost", "Delivery cost", "A 5 years maintenance charges"], answer: "A 5 years maintenance charges" },
    { id: "M5_08", type: "mc", question: "Interest received on a bank deposit account is revenue income.", options: ["True", "False"], answer: "True" },
    { id: "M5_09", type: "mc", question: "Bank interest received has been entered in the accounting records as a debit to bank interest received and a credit to the bank account. This is the error of:", options: ["Principle", "Reversal of entries", "Compensation", "Omission"], answer: "Reversal of entries" },
    { id: "M5_10", type: "text", question: "Gladys is preparing a sales invoice for a credit customer. The list price of the goods is $2,800. The buyer has the following discount available:\n(1) 25% trade discount, and\n(2) 5% cash discount for payment within 7 days of invoice date\n\nAssuming the customer qualifies for all discount available, how much will the customer pay to settle this invoice?", answer: "1995" },
    { id: "M5_11", type: "text", question: "You have been provided with the following list of balance as at 1 January 2025.\n(1) Motor vehicle, $4,370\n(2) Trade receivables, $1,920\n(3) Bank loan, $4,600\n(4) Bank, $1,230\n\nWhat is the amount of capital invested in the business?", answer: "2920" },
    { id: "M5_12", type: "text", question: "Walter is preparing a sales invoice for a customer. The purchase order received from the customer shows the following:\n30 x product code EK12345 @50 each\nThe customer is entitled to a trade discount of 5%\n\nWhat amount would show as the amount payable on the invoice the customer will receive?", answer: "1425" },
    { id: "M5_13", type: "mc", question: "A business should not overstate profits but must account for future losses. This is the principle of:", options: ["Going Concern", "Consistency", "Materiality", "Prudence"], answer: "Prudence" },
    { id: "M5_14", type: "mc", question: "Goods return note is a document which accompanies items being sent back to supplier which have been found to be sub-standard.", options: ["True", "False"], answer: "True" },
    { id: "M5_15", type: "mc", question: "Walter withdrew some money from business bank account to use to purchase some new furniture for use in the business. His bookkeeper, Eva, has made the following entries in the general ledger:\nDr. Drawings\nCr. Bank\n\nIf the error is not fixed, what will be the impact on the balance on furniture account?", options: ["Overstated", "Understated", "Unchanged", "None of above"], answer: "Understated" },
    { id: "M5_16", type: "mc", question: "Gross pay is the amount the employee earns after the deduction of tax and any other voluntary deductions are applied.", options: ["True", "False"], answer: "False" },
    { id: "M5_17", type: "text", question: "Gladys works as a production worker in a factory. For each unit Gladys produces, she is paid $2.0. If she produces more than 200 in a week, she is also paid a bonus of $0.50 per unit for each unit above 200 units.\nGladys produced 230 units in a week. What is her gross pay for the period?", answer: "475" },
    { id: "M5_18", type: "text", question: "Nicholas works as Sales Director. His basic salary is $36,000 per annum paid evenly over the 12 months of the year.\nOnce a year, Nicholas receives a profit-related bonus of 5% of his annual salary if the profit for the financial year of the business he works for exceeds the target. The profit target was $300,000 and the actual profit achieved was $350,000. Any bonus payable will be included in Nicholas' gross pay in August. What is Nicholas's gross pay for August?", answer: "4800" },
    { id: "M5_19", type: "text", question: "Cherry run a small boutique. She hires 4 employees, and the payroll information for the latest week pay is as below:\n(1) Hours worked at the basic rate - 150 hours\n(2) Hours worked at time and a half - 18 hours\n(3) Hours worked at time and a quarter - 12 hours\n\nThe hourly rate is $16.00 What is the wages expenses for the week?", answer: "3072" },
    { id: "M5_20", type: "text", question: "When accounting for payroll, gross wages appear as a [debit / credit] entry in the general ledger as a business expenses?", answer: "debit" },
    { id: "M5_21", type: "mc", question: "Which one of the following identifies where the total of the discount allowed should be posted?", options: ["Dr. Receivable Ledger Control Account", "Cr. Receivable Ledger Control Account", "Dr. Payable Ledger Control Account", "Cr. Payable Ledger Control Account"], answer: "Cr. Receivable Ledger Control Account" },
    { id: "M5_22", type: "mc", question: "A payable ledger control account allows a business to identify the amount owed to individual supplier in a given period of time.", options: ["True", "False"], answer: "False" },

let currentQuestions = [];

function initQuiz() {
    document.getElementById('resultBox').style.display = 'none';
    
    // 隨機抽取 30 題
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, 30);

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    currentQuestions.forEach((q, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';
        qCard.id = `q_card_${index}`;

        let html = `<div class="question-text">Q${index + 1}. ${q.question}</div>`;

        if (q.type === 'mc') {
            html += `<div class="options">`;
            q.options.forEach((opt) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q_${index}" value="${opt}">
                        ${opt}
                    </label>
                `;
            });
            html += `</div>`;
        } else if (q.type === 'text') {
            html += `
                <div class="options">
                    <input type="text" name="q_${index}" placeholder="請在此輸入答案數值或關鍵字">
                </div>
            `;
        }

        html += `<div id="feedback_${index}" class="feedback" style="display:none;"></div>`;
        qCard.innerHTML = html;
        container.appendChild(qCard);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
    let score = 0;

    currentQuestions.forEach((q, index) => {
        const feedbackDiv = document.getElementById(`feedback_${index}`);
        let userAns = "";

        if (q.type === 'mc') {
            const selected = document.querySelector(`input[name="q_${index}"]:checked`);
            if (selected) userAns = selected.value;
        } else if (q.type === 'text') {
            const input = document.querySelector(`input[name="q_${index}"]`);
            if (input) userAns = input.value.trim();
        }

        feedbackDiv.style.display = 'block';

        const isCorrect = userAns.toString().toLowerCase().replace(/,|\$|\s/g, '') === 
                          q.answer.toString().toLowerCase().replace(/,|\$|\s/g, '');

        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = `<span class="correct">✓ 正確！</span>`;
        } else {
            feedbackDiv.innerHTML = `<span class="wrong">✗ 錯誤！</span> 你的答案：${userAns || "未作答"} | <strong>正確答案：${q.answer}</strong>`;
        }
    });

    const resultBox = document.getElementById('resultBox');
    const scoreText = document.getElementById('scoreText');
    const percentage = Math.round((score / currentQuestions.length) * 100);
    
    scoreText.innerHTML = `得分：<strong>${score} / ${currentQuestions.length}</strong> （正確率：${percentage}%）`;
    resultBox.style.display = 'block';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initQuiz;
</script>
